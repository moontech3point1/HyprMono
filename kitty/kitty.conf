font_family      JetBrainsMono Nerd Font
font_size        11.0

background            #1a1a1a
foreground            #e0e0e0
cursor                #e0e0e0
selection_background  #3a3a3a
selection_foreground  #e0e0e0

# letting some of the hyprland blur come through instead of a flat background
background_opacity   0.85
background_blur      1

# normal colors 1-6 used to all be the exact same gray (8a8a8a), which meant
# ls output, git diffs, prompt colors etc were all visually identical. spread
# them across the gray scale instead so stuff is still readable at a glance,
# just without any actual hue
color0   #1a1a1a
color8   #6c6c6c
color1   #999999
color9   #b8b8b8
color2   #8f8f8f
color10  #adadad
color3   #a5a5a5
color11  #c3c3c3
color4   #7c7c7c
color12  #9a9a9a
color5   #b0b0b0
color13  #cecece
color6   #868686
color14  #a4a4a4
color7   #c8c8c8
color15  #ffffff

window_padding_width  10
hide_window_decorations yes
confirm_os_window_close 0
