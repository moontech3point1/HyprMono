background {
    monitor =
    path = ~/Pictures/wallpapers/main.png
    blur_passes = 3
    blur_size = 8
    noise = 0.02
    contrast = 0.9
    brightness = 0.7
}

input-field {
    monitor =
    size = 250, 60
    outline_thickness = 2
    dots_size = 0.25
    dots_spacing = 0.3
    outer_color = rgba(cccccceE)
    inner_color = rgba(1a1a1add)
    font_color = rgba(e0e0e0ee)
    fade_on_empty = true
    placeholder_text = <i>password...</i>
    position = 0, -20
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:1000] echo "$(date +"%H:%M")"
    color = rgba(e0e0e0ee)
    font_size = 70
    font_family = JetBrainsMono Nerd Font
    position = 0, 150
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:1000] echo "$(date +"%A, %B %d")"
    color = rgba(e0e0e0aa)
    font_size = 20
    font_family = JetBrainsMono Nerd Font
    position = 0, 80
    halign = center
    valign = center
}
