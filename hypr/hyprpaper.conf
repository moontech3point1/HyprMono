# wallpaper config, drop your image in ~/Pictures/wallpapers and point to it below
# hyprpaper 0.8 and newer use wallpaper blocks. The legacy "preload" and
# "wallpaper = monitor,path" keywords are no longer supported.

wallpaper {
    monitor =
    path = ~/Pictures/wallpapers/main.png
    fit_mode = cover
}

# Disables the splash text hyprpaper renders over the wallpaper.
splash = false
